<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="tela">

<!-- Header -->    
<header class="header">
    <img src="img/logo1.png" class="logo1">

    <div class="search-box">
        <input type="text" class="search-input">
    </div>

    <div class="icons">
        <img src="img/Vector1.png">
        <img src="img/Vector.png">
    </div>
</header>

<main>
    <!-- Conteúdo da página -->
    <section class="conteudo">
        <div class="text">
            <h1 class="title">VALO<span>RANT</span></h1>
            <p class="subtitle">Entre em um universo onde cada decisão<br> 
                                pode definir o resultado da partida.<br>
                                <span>Valorat</span>combina mira precisa, estratégia<br>
                                e habilidades únicas em confrontos 5v5<br>
                                cheios de ação.</p>
        </div>
        <div class="buttons">
            <button class="btn-jogar">
                <span>Jogar Agora</span>
            </button>
            <button class="btn-transmisao">
                <span class="play-icon"></span>
                Assista o trailer
            </button>
        </div>
        <div>
            <img src="img/chamber-cadeira.jpg" class="cadeira">
        </div>
        <div class="degrade"></div>
        <div class="degrade2"></div>
    </section>

    <!-- Linha -->
    <div class="linha"></div>
    <div class="linha2"></div>

    <!-- Escolha seu agente -->
    <section class="Escolha">
        <div class="Agentes">
            <h1 class="title-ecolha">Escolha seu <span>Agente</span></h1>
        </div>

        <div class="agentes">
            <div class="agente-container">
                <img src="img/breechi.png" class="agente">
            </div>
            <div class="agente-container">
                <img src="img/sova.png" class="agente">
            </div>
             <div class="agente-container">
                <img src="img/jet.png" class="agente">
            </div>
            <div class="agente-container">
                <img src="img/neon.png" class="agente">
            </div>
             <div class="agente-container">
                <img src="img/cyper.png" class="agente">
            </div>
        </div>

        <div class="poderes">
            <div class="poder">
                <img src="img/Poder1.png" class="poderes-img">
            </div>
            <div class="poder">
                <img src="img/poder2.png" class="poderes-img">
            </div>
            <div class="poder">
                <img src="img/poder3.png" class="poderes-img">
            </div>
        </div>
    </section>

    <!-- Video -->
    <section class="video">
        <div class="video-container">
            <div class="caixa">
            </div>
            <img src="img/vaizer.png" alt="Video Placeholder" class="vazer">
        </div>
    </section>






</main>
    

</body>
</html>
